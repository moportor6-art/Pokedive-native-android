name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME).
      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versión
        id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Copiar el juego dentro del APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/www

      # Manifiesto del contenido (va dentro de la APK): el actualizador de la app lo compara con el de la versión nueva
      - name: Manifiesto del contenido
        run: |
          python3 .github/scripts/manifiesto.py ${{ github.run_number }} ${{ github.sha }} "$VERSION_NAME" \
            android/app/src/main/assets/contenido-base.json android/app/src/main/assets/contenido-version.json

      - name: Compilar
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ steps.ver.outputs.name }}.apk"
          ls -la out
          python3 .github/scripts/manifiesto.py --apk "out/${{ steps.ver.outputs.name }}.apk" \
            android/app/src/main/assets/contenido-base.json out/contenido.json
          { git log -1 --pretty=%B | grep -v '^Co-Authored-By\|^Claude-Session'; echo; echo "Instala \`${{ steps.ver.outputs.name }}.apk\` encima de la anterior, o deja que la app se actualice sola."; } > out/notas.md

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: Publicar versión
        # Solo cuando el repo ya trae los sprites (si no, es una compilación de prueba).
        if: hashFiles('web/assets/pokemon/manifest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: PokéDive Android ${{ steps.ver.outputs.name }}
          files: |
            out/*.apk
            out/contenido.json
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: out/notas.md
